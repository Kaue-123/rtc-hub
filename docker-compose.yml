# Os três motores oficiais + o BFF + o banco do produto.
#
# Os motores entram como vieram, pinados por tag: nenhum código da RFB é
# alterado ou fundido. Atualizar é trocar a tag, não ressincronizar código.
# As portas são 1808x porque a 8080 desta máquina já está ocupada.

services:
  regime-regular:
    build:
      context: ./upstream
      dockerfile: ../docker/regime-regular.Dockerfile
    image: rtc-hub/regime-regular:1.6.1
    ports: ["18080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/calculadora/dados-abertos/versao || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  simples-nacional:
    build:
      context: ./upstream
      dockerfile: ../docker/simples-nacional.Dockerfile
    image: rtc-hub/simples-nacional:0.0.6
    ports: ["18082:8082"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/api/versao || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  danfse:
    build:
      context: ./upstream/calculadora-rtc-gerador-danfse
    image: rtc-hub/danfse:1.0.0
    ports: ["18081:8080"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rtc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: rtc_hub
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtc -d rtc_hub"]
      interval: 10s
      retries: 10

  rtchub:
    build:
      context: .
      dockerfile: docker/rtchub.Dockerfile
    environment:
      RTC_DATABASE_URL: postgresql://rtc:${POSTGRES_PASSWORD}@postgres:5432/rtc_hub
      RTC_MOTOR_REGIME_REGULAR_URL: http://regime-regular:8080
      RTC_MOTOR_SIMPLES_URL: http://simples-nacional:8082
      RTC_MOTOR_DANFSE_URL: http://danfse:8080
    ports: ["18090:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      regime-regular: {condition: service_healthy}
      simples-nacional: {condition: service_healthy}

volumes:
  pgdata:
